name: Network Security CI CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: "316992254617"
  ECR_REPOSITORY: networksecurity
  CONTAINER_NAME: network-security-container

jobs:

  deploy:

    name: Build and Deploy Network Security

    runs-on: [self-hosted, linux, x64]

    timeout-minutes: 30

    steps:

      # =====================================
      # 1. CHECKOUT REPOSITORY
      # =====================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =====================================
      # 2. CHECK ENVIRONMENT
      # =====================================

      - name: Check Environment
        run: |

          echo "Checking EC2 environment"

          python3 --version

          docker --version

          aws --version


      # =====================================
      # 3. VERIFY MODEL
      # =====================================

      - name: Verify Model File
        run: |

          test -f final_model/model.pkl

          echo "Trained model found"


      # =====================================
      # 4. CREATE PYTHON VIRTUAL ENVIRONMENT
      # =====================================

      - name: Setup Test Environment
        run: |

          python3 -m venv .ci-venv

          .ci-venv/bin/python -m pip install --upgrade pip

          .ci-venv/bin/pip install pytest


      # =====================================
      # 5. RUN TESTS
      # =====================================

      - name: Run Pytest
        run: |

          .ci-venv/bin/python -m pytest tests/ -v


      # =====================================
      # 6. VERIFY AWS IDENTITY
      # =====================================

      - name: Verify AWS Credentials
        run: |

          aws sts get-caller-identity


      # =====================================
      # 7. LOGIN TO AMAZON ECR
      # =====================================

      - name: Login to Amazon ECR
        run: |

          aws ecr get-login-password \
            --region $AWS_REGION | \
          docker login \
            --username AWS \
            --password-stdin \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com


      # =====================================
      # 8. BUILD DOCKER IMAGE
      # =====================================

      - name: Build Docker Image
        run: |

          docker build \
            --pull \
            -t $ECR_REPOSITORY:latest \
            .


      # =====================================
      # 9. TAG DOCKER IMAGE
      # =====================================

      - name: Tag Docker Image
        run: |

          docker tag \
            $ECR_REPOSITORY:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest


      # =====================================
      # 10. PUSH IMAGE TO ECR
      # =====================================

      - name: Push Docker Image
        run: |

          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest


      # =====================================
      # 11. VERIFY ENVIRONMENT FILE
      # =====================================

      - name: Verify Environment File
        run: |

          test -f /home/ubuntu/network-security.env

          echo "Environment file found"


      # =====================================
      # 12. PULL LATEST IMAGE
      # =====================================

      - name: Pull Latest Image
        run: |

          docker pull \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest


      # =====================================
      # 13. STOP OLD CONTAINER
      # =====================================

      - name: Stop Existing Container
        run: |

          docker stop $CONTAINER_NAME || true

          docker rm $CONTAINER_NAME || true


      # =====================================
      # 14. DEPLOY NEW CONTAINER
      # =====================================

      - name: Run Docker Container
        run: |

          docker run -d \
            --name $CONTAINER_NAME \
            --restart always \
            -p 8000:8000 \
            --env-file /home/ubuntu/network-security.env \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest


      # =====================================
      # 15. VERIFY CONTAINER
      # =====================================

      - name: Verify Container
        run: |

          docker ps --filter "name=$CONTAINER_NAME"

          docker inspect \
            --format='{{.State.Status}}' \
            $CONTAINER_NAME


      # =====================================
      # 16. APPLICATION HEALTH CHECK
      # =====================================

      - name: Application Health Check
        run: |

          for i in {1..30}; do

            if python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"; then

              echo "Application is healthy"

              exit 0

            fi

            echo "Waiting for application..."

            sleep 5

          done

          echo "Application failed to start"

          docker logs $CONTAINER_NAME

          exit 1


      # =====================================
      # 17. DEPLOYMENT SUCCESS
      # =====================================

      - name: Deployment Successful
        run: |

          echo "================================"

          echo "NETWORK SECURITY DEPLOYED"

          echo "================================"

          echo "Docker deployment completed"

          echo "Port: 8000"