name: Deploy Network Security to AWS EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1: BUILD AND PUSH DOCKER IMAGE TO ECR
  # ==========================================

  build-and-push:

    name: Build and Push to AWS ECR

    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout GitHub repository

      - name: Checkout Repository
        uses: actions/checkout@v4


      # Step 2: Configure AWS credentials

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2


      # Step 3: Verify AWS account

      - name: Verify AWS Identity
        run: aws sts get-caller-identity


      # Step 4: Login to Amazon ECR

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # Step 5: Build Docker image

      - name: Build Docker Image
        run: |
          docker build -t networksecurity:latest .


      # Step 6: Tag Docker image

      - name: Tag Docker Image
        run: |
          docker tag networksecurity:latest \
          316992254617.dkr.ecr.ap-southeast-2.amazonaws.com/networksecurity:latest


      # Step 7: Push Docker image to ECR

      - name: Push Docker Image to ECR
        run: |
          docker push \
          316992254617.dkr.ecr.ap-southeast-2.amazonaws.com/networksecurity:latest


  # ==========================================
  # JOB 2: DEPLOY APPLICATION TO AWS EC2
  # ==========================================

  deploy:

    name: Deploy to AWS EC2

    needs: build-and-push

    runs-on: ubuntu-latest

    steps:

      # Step 1: Connect to EC2 and deploy

      - name: Deploy Application to EC2
        uses: appleboy/ssh-action@v1.2.0

        with:

          host: ${{ secrets.EC2_HOST }}

          username: ubuntu

          key: ${{ secrets.EC2_SSH_KEY }}

          port: 22

          script: |

            echo "Starting deployment..."

            # Login to AWS ECR using EC2 IAM Role

            aws ecr get-login-password --region ap-southeast-2 | \
            docker login \
            --username AWS \
            --password-stdin \
            316992254617.dkr.ecr.ap-southeast-2.amazonaws.com

            # Pull latest Docker image

            docker pull \
            316992254617.dkr.ecr.ap-southeast-2.amazonaws.com/networksecurity:latest

            # Stop existing container

            docker stop network-security-container || true

            # Remove existing container

            docker rm network-security-container || true

            # Start new container

            docker run -d \
              --name network-security-container \
              --restart always \
              -p 8000:8000 \
              --env-file /home/ubuntu/network-security.env \
              316992254617.dkr.ecr.ap-southeast-2.amazonaws.com/networksecurity:latest

            # Check container status

            docker ps

            echo "Deployment completed successfully!"
