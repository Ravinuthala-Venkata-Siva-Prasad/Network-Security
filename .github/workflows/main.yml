name: Network Security CI-CD Pipeline

# ==========================================
# WORKFLOW TRIGGERS
# ==========================================

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

  pull_request:
    branches:
      - main

  workflow_dispatch:


# ==========================================
# PERMISSIONS
# ==========================================

permissions:
  contents: read


# ==========================================
# JOB 1: CONTINUOUS INTEGRATION
# ==========================================

jobs:

  integration:

    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Upgrade pip
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # Step 4: Install dependencies
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest

      # Step 5: Lint Python code
      - name: Lint Code
        run: |
          flake8 src app.py \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      # Step 6: Run unit tests
      - name: Run Unit Tests
        run: |
          pytest tests/ -v

      # Step 7: CI success
      - name: CI Success
        if: success()
        run: |
          echo "Network Security CI completed successfully"


# ==========================================
# JOB 2: BUILD AND PUSH DOCKER IMAGE TO AWS ECR
# ==========================================

  build-and-push:

    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs: integration

    # Do not push images for pull requests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:

      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Step 3: Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Step 4: Build Docker image
      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ECR_LOGIN_URI }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: latest

        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .

      # Step 5: Push Docker image to ECR
      - name: Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ECR_LOGIN_URI }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: latest

        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # Step 6: Verify ECR image
      - name: Verify Docker Image
        run: |
          echo "Docker image successfully pushed to AWS ECR"
          echo "${{ secrets.AWS_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest"


# ==========================================
# JOB 3: DEPLOY DOCKER IMAGE TO AWS EC2
# ==========================================

  deploy:

    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    needs: build-and-push

    steps:

      # Step 1: Connect to EC2 using SSH
      - name: Deploy Application to EC2
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            # Login to AWS ECR
            aws ecr get-login-password \
              --region ${{ secrets.AWS_REGION }} | \
              docker login \
              --username AWS \
              --password-stdin \
              ${{ secrets.AWS_ECR_LOGIN_URI }}

            # Pull latest Docker image
            docker pull \
              ${{ secrets.AWS_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest

            # Stop existing container
            docker stop network-security-container || true

            # Remove existing container
            docker rm network-security-container || true

            # Run new Docker container
            docker run -d \
              --name network-security-container \
              --restart always \
              -p 8000:8000 \
              --env-file /home/ubuntu/network-security.env \
              ${{ secrets.AWS_ECR_LOGIN_URI }}/${{ secrets.ECR_REPOSITORY_NAME }}:latest

            # Check running container
            docker ps

            # Display application logs
            docker logs network-security-container

      # Step 2: Deployment success
      - name: Deployment Success
        if: success()
        run: |
          echo "======================================"
          echo "Network Security Deployment Successful"
          echo "Docker image deployed to AWS EC2"
          echo "======================================"
