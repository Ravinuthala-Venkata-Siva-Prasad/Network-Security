name: Network Security CI-CD Pipeline

# ==========================================
# WORKFLOW TRIGGERS
# ==========================================

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

  pull_request:
    branches:
      - main

  workflow_dispatch:


# ==========================================
# PERMISSIONS
# ==========================================

permissions:
  contents: read


# ==========================================
# JOB 1: CONTINUOUS INTEGRATION
# ==========================================

jobs:

  integration:

    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Upgrade pip
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # Step 4: Install dependencies
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest

      # Step 5: Lint Python code
      - name: Lint Code
        run: |
          flake8 src app.py \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      # Step 6: Run unit tests
      - name: Run Unit Tests
        run: |
          pytest tests/ -v

      # Step 7: CI success
      - name: CI Success
        if: success()
        run: |
          echo "Network Security CI completed successfully"


# ==========================================
# JOB 2: BUILD AND PUSH DOCKER IMAGE TO ECR
# ==========================================

  build-and-push:

    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs: integration

    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:

      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # Step 3: Verify AWS identity
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # Step 4: Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Step 5: Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t 316992254617.dkr.ecr.ap-southeast-2.amazonaws.com/networksecurity:latest \
            .

      # Step 6: Verify Docker image
      - name: Verify Docker Image
        run: |
          docker images

      # Step 7: Push Docker image to ECR
      - name: Push Docker Image to ECR
        run: |
          docker push \
            316992254617.dkr.ecr.ap-southeast-2.amazonaws.com/networksecurity:latest

      # Step 8: Verify ECR image
      - name: Verify ECR Image
        run: |
          aws ecr describe-images \
            --repository-name networksecurity \
            --image-ids imageTag=latest \
            --region ap-southeast-2

          echo "Docker image successfully pushed to ECR"


# ==========================================
# JOB 3: DEPLOY DOCKER IMAGE TO AWS EC2
# ==========================================

  deploy:

    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    needs: build-and-push

    steps:

      # Step 1: Connect to EC2 using SSH
      - name: Deploy Application to EC2
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            set -e

            # Step 1: Login to AWS ECR
            aws ecr get-login-password \
              --region ap-southeast-2 | \
              docker login \
              --username AWS \
              --password-stdin \
              316992254617.dkr.ecr.ap-southeast-2.amazonaws.com

            # Step 2: Pull latest Docker image
            docker pull \
              316992254617.dkr.ecr.ap-southeast-2.amazonaws.com/networksecurity:latest

            # Step 3: Stop existing container
            docker stop network-security-container || true

            # Step 4: Remove existing container
            docker rm network-security-container || true

            # Step 5: Run new Docker container
            docker run -d \
              --name network-security-container \
              --restart always \
              -p 8000:8000 \
              --env-file /home/ubuntu/network-security.env \
              316992254617.dkr.ecr.ap-southeast-2.amazonaws.com/networksecurity:latest

            # Step 6: Check running container
            docker ps

            # Step 7: Check application logs
            docker logs --tail 50 network-security-container

      # Step 2: Deployment success
      - name: Deployment Success
        if: success()
        run: |
          echo "========================================"
          echo "Network Security Deployment Successful"
          echo "Docker image deployed to AWS EC2"
          echo "========================================"
