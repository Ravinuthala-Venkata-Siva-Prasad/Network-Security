name: Network Security CI-CD Pipeline

# ==========================================
# WORKFLOW TRIGGERS
# ==========================================

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

  pull_request:
    branches:
      - main

  workflow_dispatch:


# ==========================================
# PERMISSIONS
# ==========================================

permissions:
  contents: read


# ==========================================
# JOB 1: CONTINUOUS INTEGRATION
# ==========================================

jobs:

  integration:

    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Upgrade pip
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # Step 4: Install dependencies
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest

      # Step 5: Lint Python code
      - name: Lint Code
        run: |
          flake8 src app.py \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      # Step 6: Run unit tests
      - name: Run Unit Tests
        run: |
          pytest tests/ -v

      # Step 7: CI success
      - name: CI Success
        if: success()
        run: |
          echo "Network Security CI completed successfully"


# ==========================================
# JOB 2: BUILD AND PUSH DOCKER IMAGE TO ECR
# ==========================================

  build-and-push:

    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs: integration

    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:

      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # Step 3: Validate AWS ECR configuration
      - name: Validate ECR Configuration
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ECR_LOGIN_URI }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}

        run: |
          set -e

          echo "Checking ECR configuration..."

          if [ -z "$ECR_REGISTRY" ]; then
            echo "ERROR: AWS_ECR_LOGIN_URI is missing"
            exit 1
          fi

          if [ -z "$ECR_REPOSITORY" ]; then
            echo "ERROR: ECR_REPOSITORY_NAME is missing"
            exit 1
          fi

          # Remove accidental whitespace and line breaks
          ECR_REGISTRY="$(echo "$ECR_REGISTRY" | tr -d '[:space:]')"
          ECR_REPOSITORY="$(echo "$ECR_REPOSITORY" | tr -d '[:space:]')"

          # Validate registry format
          if [[ ! "$ECR_REGISTRY" =~ ^[0-9]{12}\.dkr\.ecr\.ap-southeast-2\.amazonaws\.com$ ]]; then
            echo "ERROR: Invalid ECR registry URI"
            exit 1
          fi

          # Validate repository name
          if [[ ! "$ECR_REPOSITORY" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]; then
            echo "ERROR: Invalid ECR repository name"
            exit 1
          fi

          echo "ECR registry and repository configuration are valid."

      # Step 4: Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Step 5: Build Docker image
      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ECR_LOGIN_URI }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: latest

        run: |
          set -e

          ECR_REGISTRY="$(echo "$ECR_REGISTRY" | tr -d '[:space:]')"
          ECR_REPOSITORY="$(echo "$ECR_REPOSITORY" | tr -d '[:space:]')"

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Building Docker image..."

          echo "Image repository: ${ECR_REPOSITORY}"
          echo "Image tag: ${IMAGE_TAG}"

          docker build -t "$IMAGE_URI" .

          echo "Docker image built successfully."

      # Step 6: Push Docker image to ECR
      - name: Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ECR_LOGIN_URI }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: latest

        run: |
          set -e

          ECR_REGISTRY="$(echo "$ECR_REGISTRY" | tr -d '[:space:]')"
          ECR_REPOSITORY="$(echo "$ECR_REPOSITORY" | tr -d '[:space:]')"

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker push "$IMAGE_URI"

          echo "Docker image pushed successfully."

      # Step 7: Verify image
      - name: Verify ECR Image
        env:
          AWS_REGION: ap-southeast-2
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}

        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag=latest \
            --region "$AWS_REGION"

          echo "ECR image verification successful."


# ==========================================
# JOB 3: DEPLOY DOCKER IMAGE TO AWS EC2
# ==========================================

  deploy:

    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    needs: build-and-push

    steps:

      # Step 1: Connect to EC2 and deploy
      - name: Deploy Application to EC2
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            set -e

            # Login to AWS ECR
            aws ecr get-login-password \
              --region ap-southeast-2 | \
              docker login \
              --username AWS \
              --password-stdin \
              316992254617.dkr.ecr.ap-southeast-2.amazonaws.com

            # Pull latest Docker image
            docker pull \
              316992254617.dkr.ecr.ap-southeast-2.amazonaws.com/networksecurity:latest

            # Stop existing container
            docker stop network-security-container || true

            # Remove existing container
            docker rm network-security-container || true

            # Run new Docker container
            docker run -d \
              --name network-security-container \
              --restart always \
              -p 8000:8000 \
              --env-file /home/ubuntu/network-security.env \
              316992254617.dkr.ecr.ap-southeast-2.amazonaws.com/networksecurity:latest

            # Check running container
            docker ps

            # Display application logs
            docker logs --tail 50 network-security-container

      # Step 2: Deployment success
      - name: Deployment Success
        if: success()
        run: |
          echo "========================================"
          echo "Network Security Deployment Successful"
          echo "Docker image deployed to AWS EC2"
          echo "========================================"
